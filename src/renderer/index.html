<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      内容安全策略（CSP）由构建配置注入 —— 见 electron.vite.config.ts 的 cspPlugin()。

      为什么不能写死在这里：开发模式下 @vitejs/plugin-react 会注入一段**内联**脚本
      （React Refresh 前导代码），需要 script-src 放行 'unsafe-inline'；
      而生产构建不需要它，就不该放开。所以开发和生产必须是两份不同的策略。

      ⚠ 当初把严格版写死在这里，直接导致「界面永远挂载不上、终端毫无报错」。
        详见 docs/DECISIONS.md 第 5.9 节。这一行标记是注入点，不要删。
    -->
    <!-- VRCBW-CSP -->
    <title>VRCBioWatcher</title>
  </head>
  <body>
    <!--
      静态占位内容：如果界面的 React 脚本成功挂载，createRoot 会把它整个替换掉。
      如果脚本没能挂载（被 CSP 拦、加载失败、抛错），这段文字就会一直留着 ——
      用户看到的就不再是一片无法解释的空白，而是一条能照着做的提示。

      样式用内联属性写，因为它必须在 CSS 加载之前就生效。
      （CSP 的 style-src 放行了 'unsafe-inline'，所以内联样式不受影响。）
      配色跟随浅色主题；深色下这段提示只在启动瞬间可见，可以接受。
    -->
    <div id="root">
      <div
        style="
          font-family: 'Segoe UI', 'Microsoft YaHei UI', 'Microsoft YaHei', sans-serif;
          color: #1f2430;
          padding: 32px;
          line-height: 1.8;
        "
      >
        <p style="margin: 0 0 10px; font-size: 15px">正在启动界面…</p>
        <p style="margin: 0; font-size: 13px; color: #6b7280">
          如果这段文字一直不消失，说明界面的脚本没有加载成功。<br />
          请查看运行 <code style="color: #1e3a8a">scripts\dev.ps1</code> 的终端里
          <code style="color: #1e3a8a">[renderer/…]</code> 开头的输出。<br />
          详细的诊断数据也会写入项目目录下的
          <code style="color: #1e3a8a">_dev/startup-report.json</code>。
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
